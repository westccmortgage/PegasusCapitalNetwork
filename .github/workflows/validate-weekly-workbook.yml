name: Validate weekly Pegasus workbook
on:
  push:
    branches:
      - automation/exceljs-validation-20260727
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - name: Generate and validate workbook
        shell: bash
        run: |
          set -o pipefail
          node qa/generate-validate-weekly-workbook.js 2>&1 | tee Pegasus-Intelligence-2026-07-27-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pegasus-Intelligence-2026-07-27
          path: |
            Pegasus-Intelligence-2026-07-27.xlsx
            Pegasus-Intelligence-2026-07-27-validation.json
            Pegasus-Intelligence-2026-07-27-validation.log
          if-no-files-found: warn
